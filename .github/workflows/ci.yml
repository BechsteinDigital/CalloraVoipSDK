name: ci

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

# Cancel superseded runs on the same PR/branch to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CalloraVoipSdk.sln

      - name: Build
        run: dotnet build CalloraVoipSdk.sln --configuration Release --no-restore -p:CodeAnalysisTreatWarningsAsErrors=true

      - name: Architecture gates (ENGINEERING_RULES)
        run: dotnet test tests/CalloraVoipSdk.ArchitectureTests/CalloraVoipSdk.ArchitectureTests.csproj --configuration Release --no-build --nologo --verbosity minimal

      - name: Test + Coverage (Non-Core)
        run: dotnet test CalloraVoipSdk.sln --configuration Release --no-build --filter "Category!=SoakLong&Category!=Interop&Category!=InteropFreeSwitch&Category!=BrowserInterop&Category!=Chaos&Category!=Perf&FullyQualifiedName!~ArchitectureTests" --collect:"XPlat Code Coverage" --results-directory ./TestResults --nologo --verbosity minimal

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: |
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      # Linux only: the baseline is platform-specific. Audio.Linux is dead code on Windows
      # and Audio.Windows is dead code here, so one number cannot describe both runners.
      # Runs after the upload so the reports are downloadable even when the gate fails.
      - name: Coverage gate
        if: always() && matrix.os == 'ubuntu-latest'
        run: python3 .github/scripts/check-coverage.py

  interop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CalloraVoipSdk.sln

      - name: Build
        run: dotnet build CalloraVoipSdk.sln --configuration Release --no-restore

      - name: Interop tests (Docker/Asterisk)
        # InteropLocalMedia ausgeschlossen: Zwei-Bein-SRTP-Bridge-Media ist auf GitHub-Runnern nicht
        # zuverlässig messbar (byte-exakter Content flakte stark, lokal 100% stabil) — lokaler/FreeSWITCH-Check.
        # InteropFreeSwitch ausgeschlossen: FreeSWITCH-Matrix lokal-first (noch nicht im PR-CI-Gate,
        # bis über mehrere Läufe stabil) — läuft lokal grün gegen echtes FreeSWITCH.
        run: dotnet test tests/CalloraVoipSdk.InteropTests/CalloraVoipSdk.InteropTests.csproj --configuration Release --no-build -f net10.0 --filter "Category=Interop&Category!=InteropLocalMedia&Category!=InteropFreeSwitch" --nologo --verbosity minimal

  chaos:
    runs-on: ubuntu-latest
    # Bounded so a hung chaos scenario (e.g. a socket that never closes) fails loudly instead of stalling.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CalloraVoipSdk.sln

      - name: Build
        run: dotnet build CalloraVoipSdk.sln --configuration Release --no-restore

      - name: Chaos / fault-injection gate (CORE-011)
        # Fault-injection scenarios (transport loss, malformed/adversarial packets, signaling outage,
        # resource churn under fault) assert graceful degradation + recovery + no leak. Own Linux job on every
        # PR; the build-and-test job excludes Category=Chaos, so there is no double run. Socket-descriptor leak
        # detection is Linux-only (the churn test guards the non-Linux sentinel).
        run: dotnet test tests/CalloraVoipSdk.SoakTests/CalloraVoipSdk.SoakTests.csproj --configuration Release --no-build -f net10.0 --filter "Category=Chaos" --nologo --verbosity minimal

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CalloraVoipSdk.sln

      - name: Build
        run: dotnet build CalloraVoipSdk.sln --configuration Release --no-restore

      - name: Performance gate (media hot-path throughput floors)
        # Micro-benchmarks of the SRTP per-packet crypto hot path assert a generous throughput floor
        # (~7-8x below the measured Debug baseline) — catches catastrophic regressions (sync-over-async,
        # O(n^2), allocation storms) without flaking on CI CPU variance. Own PR job; the build-and-test job
        # excludes Category=Perf. Release build so the numbers reflect shipped code.
        run: dotnet test tests/CalloraVoipSdk.SoakTests/CalloraVoipSdk.SoakTests.csproj --configuration Release --no-build -f net10.0 --filter "Category=Perf" --nologo --verbosity minimal

  browser-interop:
    runs-on: ubuntu-latest
    # Video (VP8) decode kann unter CI-CPU-Druck bis ~90 s je Test brauchen; großzügiger Job-Puffer.
    # 20 statt 15, seit Install-Schritte einen Retry haben: der Normalfall bleibt bei ~40 s, aber ein
    # einmal hängender Mirror soll den Retry noch bezahlen können, statt den Job kurz vor den Tests zu
    # kappen. Die Schritt-Timeouts sind die eigentliche Grenze — dieser Wert ist nur das Dach.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CalloraVoipSdk.sln

      - name: Build
        run: dotnet build CalloraVoipSdk.sln --configuration Release --no-restore

      - name: apt-Netzwerkwartezeiten begrenzen
        # Ohne das wartet apt unbegrenzt auf einen zähen Mirror. Gemessen am 2026-08-17 (Runs 32068834396
        # und 32071229687): archive.ubuntu.com lieferte die erste InRelease erst nach 38 s und blieb danach
        # zwölf Minuten stehen — bis das Job-Budget aufgebraucht war. apt liest apt.conf.d, also gelten die
        # Grenzen auch für das apt-get, das Playwright selbst startet.
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          CONF

      - name: Playwright-Systemabhängigkeiten (apt)
        # Getrennt vom Browser-Download (vorher ein --with-deps-Aufruf), damit im Log sofort sichtbar ist,
        # welche Hälfte klemmt — die Messung oben war nur deshalb möglich, weil apt zufällig zuerst lief.
        # Jeder Versuch ist hart begrenzt: ein hängendes apt kostet 100 s und einen Retry, nicht den Job.
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if timeout --signal=TERM --kill-after=15s 100s \
                 pwsh tests/CalloraVoipSdk.BrowserInteropTests/bin/Release/net10.0/playwright.ps1 \
                 install-deps chromium firefox; then
              exit 0
            fi
            echo "::warning::apt-Versuch $attempt hing oder schlug fehl — Retry"
            # Ein abgeschossener Versuch kann apt/dpkg mit gehaltenem Lock hinterlassen; sonst scheitert
            # der Retry am Lock statt am eigentlichen Problem.
            sudo pkill -TERM -f 'apt-get|dpkg' || true
            sleep 5
          done
          exit 1

      - name: Playwright-Browser (Chromium + Firefox)
        # Befüllt ~/.cache/ms-playwright/{chromium,firefox}-* (wo BrowserEngine die Browser der Matrix sucht).
        timeout-minutes: 6
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            if timeout --signal=TERM --kill-after=15s 150s \
                 pwsh tests/CalloraVoipSdk.BrowserInteropTests/bin/Release/net10.0/playwright.ps1 \
                 install chromium firefox; then
              exit 0
            fi
            echo "::warning::Browser-Download-Versuch $attempt hing oder schlug fehl — Retry"
            sleep 5
          done
          exit 1

      - name: Browser interop tests (Playwright/headless Chrome + Firefox)
        # Bisher lokal-first aus dem Haupt-Gate (Category!=BrowserInterop); hier als eigener Linux-Job
        # mit Browser-Install ins PR-CI-Gate gehoben. Die Matrix fährt jedes Szenario gegen beide Motoren
        # (per-Browser-Fact skippt einen nicht installierten). Der build-and-test-Job schließt sie weiterhin
        # aus, also kein Doppellauf.
        run: dotnet test tests/CalloraVoipSdk.BrowserInteropTests/CalloraVoipSdk.BrowserInteropTests.csproj --configuration Release --no-build -f net10.0 --filter "Category=BrowserInterop" --nologo --verbosity minimal
